[package]
name = "orko-providers"
version.workspace = true
description = "OpenAI-compatible provider engine and presets for orko"
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["transport-hyper"]
# The default HTTP transport: hyper 1.x over async-net and rustls. It works
# under any executor (Tokio, smol, `block_on`). Without it you get the codec
# and engine, and you supply the transport.
transport-hyper = [
    "dep:hyper",
    "dep:http",
    "dep:http-body-util",
    "dep:bytes",
    "dep:async-io",
    "dep:async-net",
    "dep:futures-rustls",
    "dep:rustls",
    "dep:rustls-native-certs",
]

[dependencies]
orko-core.workspace = true
serde_json.workspace = true
futures.workspace = true
eventsource-stream.workspace = true

hyper = { workspace = true, optional = true }
http = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
async-io = { workspace = true, optional = true }
async-net = { workspace = true, optional = true }
futures-rustls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }

[dev-dependencies]
futures = { workspace = true, features = ["executor"] }
