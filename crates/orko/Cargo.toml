[package]
name = "orko"
version.workspace = true
description = "Agent orchestration toolkit for Rust, batteries-included facade"
license.workspace = true
repository.workspace = true
readme = "../../README.md"
edition.workspace = true
rust-version.workspace = true

[dependencies]
orko-core.workspace = true
orko-macros = { workspace = true, optional = true }
orko-providers = { workspace = true, optional = true }

[features]
default = ["providers"]
core = []
macros = ["dep:orko-macros"]
providers = ["dep:orko-providers"]
# graph, mcp and runtime come back once those crates have code.
full = ["macros", "providers"]

[dev-dependencies]
futures.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

# Examples live at the workspace root; the facade owns them.
[[example]]
name = "hello_openai"
path = "../../examples/hello_openai.rs"
required-features = ["providers"]

[[example]]
name = "hello_deepseek"
path = "../../examples/hello_deepseek.rs"
required-features = ["providers"]
