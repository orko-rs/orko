[workspace]
resolver = "2"
members = [
    "crates/orko-core",
    "crates/orko-macros",
    "crates/orko-graph",
    "crates/orko-runtime",
    "crates/orko-mcp",
    "crates/orko-providers",
]

[workspace.package]
version = "0.1.0"
description = "Agent orchestration toolkit for Rust"
license = "Apache-2.0"
repository = "https://github.com/orko-rs/orko"
edition = "2021"
rust-version = "1.82"

[workspace.dependencies]
# --- shared third-party deps, pinned once ---
tokio = { version = "1", default-features = false }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false }
hyper-rustls = { version = "0.27", default-features = false, features = ["native-tokio", "ring", "http1", "tls12"] }
http = "1"
http-body-util = "0.1"
schemars = "0.8"
eventsource-stream = "0.2"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
criterion = "0.5"
candle-core = "0.8"
bytes = "1"

# workspace crates
orko-core = { version = "0.1.0", path = "crates/orko-core" }
orko-macros = { version = "0.1.0", path = "crates/orko-macros" }
orko-providers = { version = "0.1.0", path = "crates/orko-providers" }
orko-graph = { version = "0.1.0", path = "crates/orko-graph" }
orko-mcp = { version = "0.1.0", path = "crates/orko-mcp" }
orko-runtime = { version = "0.1.0", path = "crates/orko-runtime" }
