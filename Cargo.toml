[workspace]
resolver = "3"
members = [
    "crates/orko-core",
    "crates/orko-macros",
    "crates/orko-graph",
    "crates/orko-runtime",
    "crates/orko-mcp",
    "crates/orko-providers",
]

[workspace.package]
version = "0.0.0"
description = "Agent orchestration toolkit for Rust (under development)"
license = "Apache-2.0"
repository = "https://github.com/orko-rs/orko.git"
edition = "2024"
